
# GitHub Actions workflow for automated Python testing and code quality checks.

name: Python CI Pipeline

# Run the pipeline when code is pushed to main or a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Define the jobs executed by this workflow.
jobs:
  test:
    # Display name of the job in GitHub Actions.
    name: Test and Lint

    # Run the job on a fresh Ubuntu virtual machine.
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python 3.11 and enable pip dependency caching.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Upgrade pip and install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Check Python files for style and linting errors.
      - name: Run Flake8
        run: python -m flake8 .

      # Execute automated tests using pytest.
      - name: Run Pytest
        run: python -m pytest -v
